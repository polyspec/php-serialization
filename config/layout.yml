# The folder layout of php-serialization (S5, S7, S9), checked by make layout-check: the common rules of config/layout.kit.yml
# and the map of this repository.
version: 1
extends:
  - layout.kit.yml

rules:
  # .npmrc holds the allow-remote of npm, which the URL pin of @polyspec/kit in package.json needs.
  - extends_template: root-files
    id: layout-root-files
    vars: { root_files: "{.npmrc}" }

  - extends_template: no-repository-prefix
    id: layout-no-repository-prefix
    vars: { repo: php-serialization }

  - extends_template: go-module-path
    id: layout-go-module-path
    vars: { repo: php-serialization }

  - id: layout-infrastructure-typescript
    paths:
      - "scripts/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"
      - "tests/**/*.{js,mjs,cjs,py,sh,bash,zsh,rb,pl,php,go,rs,ps1,bat,cmd}"

  # S6 exception of the transition (docs/spec/php-serialize.md#transition): legacy/ holds the Node.js and Python packages
  # that the generated bindings replace, under their former paths, until each is removed by a change of its own (plan
  # V-6 (5)).
  - id: layout-root-folders
    paths: ["*", "!packages", "!contracts", "!docs", "!scripts", "!tests", "!examples", "!benchmarks", "!config", "!.github", "!.kit", "!.mise", "!legacy"]

  # T-1a: the stub of the PHP extension is generated into packages/php-ext/generated, which is not tracked.
  - id: php-ext-stub-place
    paths: ["**/*.stub.php", "!packages/php-ext/src/*.stub.php", "!packages/php-ext/generated/*.stub.php"]
