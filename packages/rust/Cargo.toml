[package]
name = "polyspec-php-serialization"
version = "0.0.6"
edition = "2021"
rust-version = "1.99.0"
description = "The serialize format of PHP: its values, unserialize and serialize, byte for byte as PHP"
readme = "README.md"
repository = "https://github.com/polyspec/php-serialization.git"
license = "BSD-3-Clause"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a library that takes or gives a
# php_value reads the value table from the package that Cargo resolved (RQ-011; binding design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json", "/README.md"]

[lib]
name = "polyspec_php_serialization"
path = "src/lib.rs"

[features]
# G-5, X-1: compiles the arming of the fault injection points of `fault`; a generated binding crate turns it on for its
# tests only, and a release build never does (binding design 3.6).
fault-test = ["polyspec-binding-core/fault-test"]

[dependencies]
ryu = "=1.0.23"
# The description of language values (HostValue, Handle, KeyedMap), the callback exception (Raised, Failure) and the
# kind interface that the generated bindings read (binding design T-3, E-1, E-1c). The git source is the binding
# repository on the branch that every repository uses; Cargo.lock pins its commit, so the generated binding crates and
# this crate share one binding_core.
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core" }

[dev-dependencies]
# The tests raise a callback exception as a binding does, which only the feature construct allows, and arm the fault
# injection points of a case as a generated binding test does (fault-test).
polyspec-binding-core = { git = "https://github.com/polyspec/binding.git", branch = "v1/rust-core", features = ["construct", "fault-test"] }
base64 = "=0.22.1"
libtest-mimic = "=0.8.2"
# float_roundtrip: a float of a case reads back as the float that PHP wrote (G-5).
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

# One trial per case of contracts/php-serialize.json, so the harness of the test is libtest-mimic.
[[test]]
name = "contract"
harness = false

# The probe of make fuzz (scripts/fuzz.mts): one JSON reply per base64 input.
[[example]]
name = "probe"

[lints]
workspace = true
