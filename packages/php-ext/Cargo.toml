# Generated by bindgen from the interface contract; do not edit. Run make bindings to write it again.
[package]
name = "polyspec-php-serialize-php-ext"
version = "0.0.6"
edition = "2021"
rust-version = "1.99.0"
publish = false

[lib]
name = "polyspec_php_serialize"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
panic-test = []

[dependencies]
polyspec-php-serialize = { path = "../rust" }
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }
ext-php-rs = "=0.16.4"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
