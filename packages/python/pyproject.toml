[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "polyspec-php-serialize"
version = "0.0.3"
description = "The PHP serialize format for Python, ported from the php-src source"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"polyspec.php_serialize" = ["py.typed"]

# vulture reports unused functions and classes from its default confidence on; make lint-python runs it from this folder.
[tool.vulture]
min_confidence = 60
