[toolchain]
channel = "1.99.0"
profile = "minimal"
# clippy is the lint of make lint-rust and make lint-bindings. llvm-tools holds the llvm-strip that make release-go-static
# runs from the toolchain of the checkout, never from PATH, and the llvm-size and llvm-nm that binding release-go-module reads.
components = ["rustfmt", "clippy", "llvm-tools"]
# wasm32-unknown-unknown is the target of the WASM crate of packages/ts/wasm, which make node-package and make release-npm
# build; the musl targets are those of the Go libraries that make release-go-static builds on a Linux host (binding GN-19b).
# The install of the toolchain installs them, so a job that builds these needs no step of its own.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
