# The bootstrap of every CI job of php-serialize: .github/workflows/ci.yml and release.yml run it after their checkout with
# `uses: ./.github/actions/bootstrap`. It installs the locked kit package, whose utilities the Makefile runs, then the mise,
# node and npm of mise.toml and the packages of package-lock.json. A job that needs PHP sets it up before.
name: bootstrap
description: Sets up the Node.js of mise.toml, installs the locked kit package, then the npm of var/tools and the packages.
runs:
  using: composite
  steps:
    # actions/setup-node v7.1.0: the Node.js of mise.toml starts the bootstrap, which installs that release into var/tools with
    # mise; the recipes then run the node of var/tools. The pinned npm of var/tools installs the packages, so the cache of
    # setup-node is off.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: mise.toml
        package-manager-cache: false
    # npm 11 of the runner refuses to run in a folder whose devEngines names npm 12.2.0 (EBADDEVENGINES), so the npm of
    # devEngines runs outside the checkout with --prefix; it reads the .npmrc of the checkout, whose allow-remote lets it
    # install the kit package of its release URL.
    - name: install the locked kit package
      shell: bash
      run: |
        root="$PWD"
        version="$(node -p 'require("./package.json").devEngines.packageManager.version')"
        (cd "${RUNNER_TEMP:?RUNNER_TEMP is not set}" && npm_config_cache="$root/var/bootstrap/npm-cache" npm exec --yes --package="npm@$version" -- npm --prefix "$root" ci --ignore-scripts)
    - name: install npm
      shell: bash
      run: make install-tools TOOLS=npm
    - name: install packages
      shell: bash
      run: make install-packages
