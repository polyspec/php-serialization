# The assets of each platform of the bindings of php-serialization (binding GN-19a, GN-19i). The workflow ci calls it for the
# commit of its run, and the workflow release calls it for the tree of the tag that it releases, with release true, which runs
# the release check of binding before a job builds (make release-binding-check).
#
# The job platform runs on the runner of its platform, ubuntu-26.04, ubuntu-26.04-arm or macos-15, the one exception to the
# runner rule of AGENTS.md: the asset of a platform is linked and loaded only on that platform, because no tool of the release
# compiles for another platform (make workflows-test checks the three entries). Each job writes the release recipes of the
# contract with the binding of package.json (make release-recipes, packages/release.mk), then builds the static library of
# the Go module, the abi3 wheel and the npm platform package of its platform;
# the separate job php builds one PHP extension per platform and minor;
# the job npm packs the npm package itself with the wasm-bindgen of mise.toml. Each uploads var/release/assets as an
# artifact, which the workflow release downloads. Each job runs one recipe of the Makefile, make ci-assets-<job>, with the
# values of its matrix and the input release as make variables: the recipe installs and writes what the job needs, which
# stops at a failure, then builds every asset of the job also after a failed one, so one run names every asset that does
# not build.
name: assets

on:
  workflow_call:
    inputs:
      ref:
        description: The tag whose tree the jobs build; empty builds the commit of the calling run
        required: false
        type: string
        default: ''
      release:
        description: Whether each job runs the release check of binding before it builds
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v7.0.1: the tree of the tag, or of the commit of the calling run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # The Rust toolchain of rust-toolchain.toml with its musl targets and llvm-tools, the locked crates, the uv and the
      # Python of mise.toml, with which uv builds the wheel, then the static library of the Go module, the wheel and the npm
      # platform package.
      - name: build the assets of the platform
        run: make ci-assets-platform RELEASE=${{ inputs.release }}
      # actions/upload-artifact v7.0.1: the assets of the platform.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-${{ matrix.platform }}
          path: var/release/assets/
          if-no-files-found: error


  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.4'
          - platform: linux-x64-gnu
            runner: ubuntu-26.04
            php: '8.5'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.4'
          - platform: linux-arm64-gnu
            runner: ubuntu-26.04-arm
            php: '8.5'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.4'
          - platform: darwin-arm64
            runner: macos-15
            php: '8.5'
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v7.0.1: the requested tree, independently for each PHP minor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      # shivammathur/setup-php 2.40.0: one PHP minor per fresh job prevents retained library state.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      # The Rust toolchain and the locked crates, LLVM, then the extension for the PHP of the setup, whose minor the build
      # checks against EXPECTED_PHP_MINOR.
      - name: build the PHP extension
        run: make ci-assets-php EXPECTED_PHP_MINOR=${{ matrix.php }} RELEASE=${{ inputs.release }}
      # actions/upload-artifact v7.0.1: the isolated platform and minor asset.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-php-${{ matrix.platform }}-${{ matrix.php }}
          path: var/release/assets/
          if-no-files-found: error

  npm:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/bootstrap
      # The Rust toolchain and the locked crates and the wasm-bindgen of mise.toml, then the npm package.
      - name: pack the npm package
        run: make ci-assets-npm RELEASE=${{ inputs.release }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: assets-npm
          path: var/release/assets/
          if-no-files-found: error
