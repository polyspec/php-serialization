# Release workflow of php-serialization. Each step runs one target of the Makefile, or of the release recipes that it includes
# (packages/release.mk, which make release-recipes writes with binding), with TAG, vX.Y.Z, which release-tag writes.
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main: it checks out the head_sha of that run,
# and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log, which is the
# tip of its push; a commit whose top version is tagged elsewhere ends green with nothing to release, and a top version that no
# run released fails and names its version commit. A concurrency group of the job tag runs one release of the repository at a
# time. A dispatch of the workflow with the id of a successful CI run releases the commit of that run. The run is the evidence;
# the release runs no test again. Its jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone. The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: tag the commit of the CI run
        run: make release-tag ${{ github.event_name == 'workflow_run' && 'AUTO=1' || '' }}
      - id: tag
        name: give the tag to the later jobs
        run: make release-tag-output

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release builds the tree of the tag with its own kit and packages, with the whole history for the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - name: verify the Composer archive tool
        run: make release-zip
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which the tools of the release read when it is declared.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: make release-tools
        run: make release-tools
      # The tools of var/tools/bin — the Go of mise.toml that the release builds with, and whatever else the packages
      # need — join PATH for the steps that follow; a step's PATH is its own, so the export goes to the file the
      # runner reads between steps.
      - name: put the installed tools on PATH
        run: make release-tools-path
      - name: build the assets
        run: make release-assets
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/assets
          merge-multiple: true
      # The Rust toolchain, whose llvm-nm and llvm-size check the libraries, and the Go of mise.toml, with which a consumer
      # proves the commit of the Go module.
      - name: install the Rust toolchain and the locked crates
        run: make php-serialization-install-rust
      - name: install Go
        run: make install-tools TOOLS=go
      - name: write the release recipes
        run: make release-recipes
      # binding makes the commit of the Go module with the identity of the Git of the run, which is the actor of the run, as the
      # tags of release-tag are.
      - name: carry the Go module of the tag
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: make release-go-module
      - name: create the draft release
        run: make release-publish
      - name: upload the assets of each platform
        run: make release-platform-assets
      - name: make the release public
        run: make release-undraft
