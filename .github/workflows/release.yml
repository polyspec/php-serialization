# Release workflow of php-serialization. Each job runs its recipe ci-release-<job> of the Makefile in one run step (T2.23),
# which runs the targets of the Makefile and of the release recipes that it includes (packages/release.mk, which make
# release-recipes writes with binding), with TAG, vX.Y.Z, which release-tag writes.
#
# The workflow starts by itself when a push run of the CI workflow ci succeeds on main: it checks out the head_sha of that run,
# and release-tag with AUTO releases it only when it is the version commit of the top ## X.Y.Z of its change log, which is the
# tip of its push; a commit whose top version is tagged elsewhere ends green with nothing to release, and a top version that no
# run released fails and names its version commit. A concurrency group of the job tag runs one release of the repository at a
# time. A dispatch of the workflow with the id of a successful CI run releases the commit of that run. The run is the evidence;
# the release runs no test again. The jobs:
#   tag      ci-release-tag: release-tag requires a completed successful push or dispatch run RUN of ci.yml on main whose
#            commit is on origin/main, reads X.Y.Z from the change log of that commit, creates and pushes the annotated tag
#            vX.Y.Z, or passes for a tag there already, and appends TAG and VERSION to GITHUB_ENV; release-tag-output gives
#            them to the later jobs. A tag pushed with the token of the run starts no run.
#   assets   assets.yml builds the assets of each platform from the tree of the tag on the runner of that platform, after the
#            release check of binding (binding GN-19a, GN-19g, GN-19i).
#   release  ci-release-release on the tree of the tag: release-tools installs the tools that config/release.json needs and
#            the later lines run with them on PATH, release-assets builds the archive of every package of kit, the artifacts
#            of the job assets join var/release/assets, release-go-module makes, proves and pushes the commit and the tag
#            packages/go/vX.Y.Z of the Go module with the libraries of every platform, release-publish creates the GitHub
#            Release of the tag as a draft with its notes and the archives, release-platform-assets uploads the assets of each
#            platform under their labels, and release-undraft makes the release public.
# A failed line leaves the release a draft and fails the run. GH_TOKEN, the token of the run, is the one environment of a job.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run of main whose commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    # A workflow_run starts the release for a successful push or dispatch run of CI alone. The concurrency group is the job's,
    # so a run whose job is skipped never replaces the pending release of a version commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout v7.0.1: with the whole history and every branch, so origin/main is there for the ancestry check; a
      # workflow_run checks out the head_sha of its CI run, never a later main (K987), and a dispatch checks out main, whose kit
      # runs release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      # The tag of the commit of the CI run RUN, given to the later jobs through the outputs of this step.
      - id: tag
        name: tag the commit of the CI run
        run: make ci-release-tag RUN="${{ inputs.run || github.event.workflow_run.id }}" AUTO="${{ github.event_name == 'workflow_run' && '1' || '' }}"

  assets:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    uses: ./.github/workflows/assets.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      release: true

  release:
    needs: [tag, assets]
    if: ${{ needs.tag.outputs.tag != '' }}
    concurrency:
      group: release-${{ github.repository }}-publish
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release builds the tree of the tag with its own kit and packages, with the whole history for the Go module.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, which the tools of the release read when it is declared.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        if: ${{ hashFiles('.php-version') != '' }}
        with:
          php-version-file: .php-version
          # The proof runs with no debugger or coverage driver, as the checks do.
          coverage: none
      - uses: ./.github/actions/bootstrap
      # actions/download-artifact v8.0.2: the assets of each platform that the job assets built, merged into
      # var/release/downloaded, which ci-release-release adds to var/release/assets after release-assets.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: assets-*
          path: var/release/downloaded
          merge-multiple: true
      # The recipe ci-release-release: release-zip, release-tools, then with the tools on PATH release-assets, the
      # downloaded assets, the Rust toolchain and Go, release-recipes, release-go-module with the identity of the actor of
      # the run, release-publish, release-platform-assets and release-undraft.
      - name: release the tag
        run: make ci-release-release TAG=${{ needs.tag.outputs.tag }} VERSION=${{ needs.tag.outputs.version }}
