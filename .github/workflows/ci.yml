# CI of php-serialization: one workflow whose jobs run the targets of the Makefile, each job the target that names its list
# (CI_SHARED, CI_FUZZ, CI_TS, CI_PYTHON and CI_RUST of the Makefile), past failures, with the report of ci-targets as an artifact. The
# release workflow releases the commit whose run of this workflow is green. The workflow starts on a push of main and
# on a manual run alone, and its last job ci-passed passes only when every other job succeeded (make workflows-test).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The checks of the repository and of the contract: alint for the layout, PHP for contracts-check, the Python of mise.toml.
  shared:
    runs-on: ubuntu-26.04-arm
    steps:
      # actions/checkout v7.0.1: with the whole history, which the checks of the documents and the owners read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, the reference of the format.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="alint php python"
      - name: shared checks
        run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The fuzz of the Rust crate and both ports against real PHP, which reads the installed Python package.
  fuzz:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="php python uv"
      - name: install the Python package
        run: make php-serialization-install-python
      - name: install the Rust toolchain and the locked crates
        run: make php-serialization-install-rust
      - name: fuzz
        run: make ci-fuzz
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-fuzz
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the unit tests of legacy/packages/js.
  ts:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: build the package
        run: make build-js
      - name: lint and unit tests
        run: make ci-ts
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-ts
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the unit tests of legacy/packages/python, against the installed package.
  python:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="python uv ruff vulture"
      - name: install the package
        run: make php-serialization-install-python
      - name: build the package
        run: make build-python
      - name: lint and unit tests
        run: make ci-python
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-python
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the tests of packages/rust: the contract and the unit tests with cargo test, clippy with the lints of R-1.
  rust:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: install the Rust toolchain and the locked crates
        run: make php-serialization-install-rust
      - name: lint and tests
        run: make ci-rust
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The result of the run: the job runs after every other job, also after a failed or cancelled one, and make ci-passed
  # passes only when each job of needs has the result success; a skipped job fails it (FAIL_SKIPPED=1). make
  # workflows-test fails this workflow when ci-passed is not its last job or when needs leaves a job out.
  ci-passed:
    if: ${{ always() }}
    needs: [shared, fuzz, ts, python, rust]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-passed FAIL_SKIPPED=1
