# CI of php-serialize: one workflow whose jobs run the targets of the Makefile, each job the target that names its list
# (CI_SHARED, CI_FUZZ, CI_TS, CI_PYTHON and CI_RUST of the Makefile), past failures, with the report of ci-targets as an artifact. The
# release workflow releases the commit whose run of this workflow is green.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The checks of the repository and of the contract: alint for the layout, PHP for contracts-check, the Python of mise.toml.
  shared:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1: with the whole history, which the checks of the documents and the owners read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # shivammathur/setup-php 2.40.0: the PHP of .php-version, the reference of the format.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="alint php python"
      - name: shared checks
        run: make ci-shared
      # actions/upload-artifact v7.0.1: the report of make ci-targets, var/report/ci-targets.
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-shared
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The fuzz of the Rust crate and both ports against real PHP, which reads the installed Python package.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version-file: .php-version
          tools: none
          coverage: none
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="php python uv"
      - name: install the Python package and the Rust toolchain
        run: make php-serialize-install-python php-serialize-install-rust
      - name: fuzz
        run: make ci-fuzz
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-fuzz
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the unit tests of packages/js.
  ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: build the package
        run: make build-js
      - name: lint and unit tests
        run: make ci-ts
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-ts
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the unit tests of packages/python, against the installed package.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: install the tools of the job
        run: make install-tools TOOLS="python uv ruff vulture"
      - name: install and build the package
        run: make php-serialize-install-python build-python
      - name: lint and unit tests
        run: make ci-python
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-python
          path: var/report/ci-targets/
          if-no-files-found: ignore

  # The lint and the tests of packages/rust: the contract and the unit tests with cargo test, clippy with the lints of R-1.
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/bootstrap
      - name: install the Rust toolchain and the locked crates
        run: make php-serialize-install-rust
      - name: lint and tests
        run: make ci-rust
      - name: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-rust
          path: var/report/ci-targets/
          if-no-files-found: ignore
