# The tools that mise installs into var/tools/mise: `make toolchain-lock` writes their digests into mise.lock and
# `make install-tools` installs them with `mise install --locked`. node, npm and python are the releases of this repository.
[tools]
node = "26.12.0"
"npm:npm" = "12.2.0"
python = "3.14.8"
uv = "0.12.24"
ruff = "0.17.2"
"github:asamarts/alint" = "0.18.2"
"pypi:vulture" = "2.16"
# The release of the go directive of packages/go/go.mod (binding GN-15), which test-go compares before it runs.
go = "1.27.3"
# The wasm-bindgen CLI writes the glue of the WASM crate and must be the release of the wasm-bindgen crate of
# packages/ts/wasm/Cargo.toml (binding GN-18), which node-package compares before it runs.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
# maturin builds the wheel of the Python binding (make test-python-binding): the binary of its GitHub release, whose
# digest mise.lock pins.
"github:PyO3/maturin" = "1.16.0"
# Composer installs the PHP lint tools that make install-tools installs for a checkout with .php-version. composer.phar is one file, so its
# sha256 is declared here, from getcomposer.org/download/<version>/composer.phar.sha256sum, and mise.lock records it.
"http:composer" = { version = "2.10.3", url = "https://getcomposer.org/download/{{ version }}/composer.phar", checksum = "sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6", bin = "composer" }

# The settings of mise and uv of this checkout: mise installs and runs only what mise.lock pins and installs nothing on its own,
# and uv downloads no Python, takes the Python of PATH, where the shims of mise come first, before a managed Python of the home,
# reads no uv.toml of the home and keeps its cache under var/tools.
[settings]
locked = true
auto_install = false

[env]
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
UV_NO_CONFIG = "1"
UV_CACHE_DIR = "{{config_root}}/var/tools/mise/cache/uv"
