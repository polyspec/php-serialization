# The tools that mise installs into var/tools/mise: `make toolchain-lock` writes their digests into mise.lock and
# `make install-tools` installs them with `mise install --locked`. node, npm and python are at the pins of kit.
[tools]
node = "26.12.0"
"npm:npm" = "12.2.0"
python = "3.14.8"
uv = "0.12.24"
ruff = "0.17.2"
"github:asamarts/alint" = "0.18.2"
"pypi:vulture" = "2.16"
# Composer installs the PHP lint tools that kit selects for a repository with .php-version. composer.phar is one file, so its
# sha256 is declared here, from getcomposer.org/download/<version>/composer.phar.sha256sum, and mise.lock records it.
"http:composer" = { version = "2.10.3", url = "https://getcomposer.org/download/{{ version }}/composer.phar", checksum = "sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6", bin = "composer" }
